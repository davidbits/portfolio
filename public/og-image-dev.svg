<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Gray-800 -->
  <rect width="1200" height="630" fill="#1f2937"/>

  <!-- Window Controls (The "IDE" look) -->
  <circle cx="60" cy="60" r="12" fill="#EF4444" fill-opacity="0.8"/> <!-- Red -->
  <circle cx="100" cy="60" r="12" fill="#EAB308" fill-opacity="0.8"/> <!-- Yellow -->
  <circle cx="140" cy="60" r="12" fill="#22C55E" fill-opacity="0.8"/> <!-- Green -->

  <!-- Abstract Code Block -->

  <!-- Line 1: Definition (Blue Keyword + White Variable) -->
  <rect x="120" y="160" width="180" height="60" rx="30" fill="#2563eb"/>
  <rect x="330" y="160" width="300" height="60" rx="30" fill="white"/>

  <!-- Line 2: Indented Logic (White) -->
  <rect x="240" y="260" width="450" height="60" rx="30" fill="white" fill-opacity="0.9"/>

  <!-- Line 3: Indented Logic (Blue Accent + White) -->
  <rect x="240" y="360" width="140" height="60" rx="30" fill="#2563eb" fill-opacity="0.9"/>
  <rect x="410" y="360" width="280" height="60" rx="30" fill="white" fill-opacity="0.9"/>

  <!-- Line 4: Deeply Indented (White) -->
  <rect x="360" y="460" width="380" height="60" rx="30" fill="white" fill-opacity="0.8"/>

  <!-- Line 5: Closing (White) -->
  <rect x="120" y="560" width="100" height="60" rx="30" fill="white"/>

</svg>